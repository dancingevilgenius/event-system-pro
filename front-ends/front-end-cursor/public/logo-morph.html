<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event System Pro — Brush Morph Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0c0c0c;
      --paper: #f3efe6;
      --muted: #6e675e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse 90% 70% at 50% 35%, #fffcf5 0%, var(--paper) 50%, #ddd5c6 100%);
      color: var(--ink);
      font-family: "DM Sans", system-ui, sans-serif;
      overflow: hidden;
    }

    .stage {
      width: min(94vw, 760px);
      text-align: center;
    }

    .frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      border: 1.5px solid var(--ink);
      background: #fffcf7;
      overflow: hidden;
    }

    svg.morph {
      width: 100%;
      height: 100%;
      display: block;
    }

    .brush {
      fill: none;
      stroke: var(--ink);
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .title-layer {
      opacity: 0;
      transition: opacity 0.55s ease;
      pointer-events: none;
    }

    .title-layer.is-on {
      opacity: 1;
    }

    .wordmark {
      font-family: "Bebas Neue", Impact, sans-serif;
      font-size: 58px;
      letter-spacing: 0.07em;
      fill: var(--ink);
    }

    .wordmark-sub {
      font-family: "DM Sans", sans-serif;
      font-size: 12px;
      letter-spacing: 0.4em;
      fill: var(--ink);
      opacity: 0.5;
    }

    .meta {
      margin-top: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
    }

    .label {
      font-size: 0.78rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--muted);
      min-height: 1.2em;
    }

    .dots { display: flex; gap: 0.45rem; }

    .dot {
      width: 7px;
      height: 7px;
      border: 1.5px solid var(--ink);
      background: transparent;
      transition: background 0.25s ease, transform 0.25s ease;
    }

    .dot.is-on {
      background: var(--ink);
      transform: scale(1.15);
    }

    .hint {
      font-size: 0.72rem;
      color: var(--muted);
    }

    button.replay {
      appearance: none;
      border: 1.5px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font: inherit;
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 0.55rem 1.1rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    button.replay:hover {
      background: var(--ink);
      color: var(--paper);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <svg class="morph" viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Event System Pro brush morph logo">
        <g id="brushes"></g>
        <g id="title" class="title-layer">
          <text x="360" y="218" text-anchor="middle" class="wordmark">EVENT SYSTEM PRO</text>
          <text x="360" y="252" text-anchor="middle" class="wordmark-sub">SCORING FOR EVERY CONTEST</text>
        </g>

    <div class="meta">
      <div class="label" id="label">Two couples — ballroom</div>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <p class="hint">Swoosh brush strokes · path morph between scenes</p>
      <button type="button" class="replay" id="replay">Replay</button>
    </div>

  <script>
    /**
     * Each stroke is a cubic-bezier ribbon with a FIXED command structure
     * so the browser / our lerper can reshape smoothly between scenes.
     * Format: M x y C c1x c1y c2x c2y x y   (repeated SEGMENTS times)
     */
    const SEGMENTS = 4;
    const STROKE_COUNT = 28;

    function clamp(n, a, b) {
      return Math.max(a, Math.min(b, n));
    }

    /** Build a multi-cubic path through points (length SEGMENTS+1). */
    function curveThrough(pts) {
      // pts: [{x,y}, ...] length SEGMENTS+1
      const p = pts.map((pt) => ({ x: pt.x, y: pt.y }));
      while (p.length < SEGMENTS + 1) p.push({ ...p[p.length - 1] });
      let d = `M ${p[0].x.toFixed(1)} ${p[0].y.toFixed(1)}`;
      for (let i = 0; i < SEGMENTS; i++) {
        const a = p[i];
        const b = p[i + 1];
        const prev = p[Math.max(0, i - 1)];
        const next = p[Math.min(p.length - 1, i + 2)];
        // Catmull-Rom → cubic
        const c1x = a.x + (b.x - prev.x) / 6;
        const c1y = a.y + (b.y - prev.y) / 6;
        const c2x = b.x - (next.x - a.x) / 6;
        const c2y = b.y - (next.y - a.y) / 6;
        d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;
      }
      return d;
    }

    function stroke(points, width = 3.2, opacity = 1) {
      return { d: curveThrough(points), width, opacity };
    }

    function pt(x, y) { return { x, y }; }

    /** Pad / trim a scene to exactly STROKE_COUNT strokes. */
    function normalize(strokes) {
      const out = strokes.slice(0, STROKE_COUNT);
      while (out.length < STROKE_COUNT) {
        const last = out[out.length - 1];
        out.push({
          d: last.d,
          width: Math.max(0.6, last.width * 0.4),
          opacity: 0,
        });
      }
      return out;
    }

    // ——— Scene: resolve into title energy / underline mark ———

      s.push(stroke([pt(430, 170), pt(450, 155), pt(470, 170), pt(455, 185), pt(435, 180)], 2.0, 0.35));
      s.push(stroke([pt(520, 175), pt(540, 165), pt(555, 178), pt(545, 192), pt(525, 188)], 2.0, 0.35));
      // Remaining strokes collapse to thin accents near the type
      for (let i = 0; i < 17; i++) {
        const x0 = 140 + i * 26;
        const wave = Math.sin(i * 0.9) * 8;
        s.push(stroke(
          [pt(x0, 240 + wave), pt(x0 + 8, 235 + wave), pt(x0 + 16, 240 + wave), pt(x0 + 12, 248 + wave), pt(x0 + 4, 246 + wave)],
          1.2 + (i % 3) * 0.3,
          0.15 + (i % 5) * 0.04
        ));
      }
      return normalize(s);
    }

    const stages = [
      { name: "Two couples — ballroom", strokes: sceneDancers, showTitle: false },
      { name: "Two fighters — lightsaber duel", strokes: sceneSaber, showTitle: false },
      { name: "Go-kart race", strokes: sceneKart, showTitle: false },
      { name: "Combat robot — mini-sumo", strokes: sceneRobot, showTitle: false },
      { name: "Event System Pro", strokes: sceneTitle, showTitle: true },
    ];

    // ——— Path parsing / interpolation ———
    function parsePath(d) {
      const nums = d.match(/-?\d*\.?\d+/g).map(Number);
      return nums;
    }

    function formatPath(nums) {
      // M x y  +  SEGMENTS * (C c1x c1y c2x c2y x y)
      let d = `M ${nums[0].toFixed(1)} ${nums[1].toFixed(1)}`;
      let i = 2;
      for (let s = 0; s < SEGMENTS; s++) {
        d += ` C ${nums[i++].toFixed(1)} ${nums[i++].toFixed(1)} ${nums[i++].toFixed(1)} ${nums[i++].toFixed(1)} ${nums[i++].toFixed(1)} ${nums[i++].toFixed(1)}`;
      }
      return d;
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function morphStroke(from, to, t) {
      const A = parsePath(from.d);
      const B = parsePath(to.d);
      const n = Math.min(A.length, B.length);
      const out = new Array(n);
      for (let i = 0; i < n; i++) out[i] = lerp(A[i], B[i], t);
      return {
        d: formatPath(out),
        width: lerp(from.width, to.width, t),
        opacity: lerp(from.opacity ?? 1, to.opacity ?? 1, t),
      };
    }

    // ——— DOM ———
    const brushesEl = document.getElementById("brushes");
    const titleEl = document.getElementById("title");
    const labelEl = document.getElementById("label");
    const dotsEl = document.getElementById("dots");

    const pathEls = [];
    for (let i = 0; i < STROKE_COUNT; i++) {
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("class", "brush");
      brushesEl.appendChild(p);
      pathEls.push(p);
    }

    stages.forEach((_, i) => {
      const d = document.createElement("span");
      d.className = "dot" + (i === 0 ? " is-on" : "");
      dotsEl.appendChild(d);
    });

    function paint(strokes) {
      strokes.forEach((s, i) => {
        const el = pathEls[i];
        el.setAttribute("d", s.d);
        el.setAttribute("stroke-width", s.width);
        el.setAttribute("opacity", s.opacity ?? 1);
      });
    }

    const HOLD_MS = 2600;
    const TITLE_HOLD_MS = 3800;
    const MORPH_MS = 1400;

    let index = 0;
    let current = stages[0].strokes();
    let timer = null;
    let raf = null;
    let running = true;

    paint(current);
    titleEl.classList.toggle("is-on", stages[0].showTitle);

    function setLabel(i) {
      labelEl.textContent = stages[i].name;
      [...dotsEl.children].forEach((dot, di) => dot.classList.toggle("is-on", di === i));
    }

    function morphTo(nextIndex) {
      return new Promise((resolve) => {
        const from = current;
        const to = stages[nextIndex].strokes();
        const showingTitle = stages[nextIndex].showTitle;
        const t0 = performance.now();

        // Title fades in near end of morph into title scene
        if (showingTitle) {
          setTimeout(() => titleEl.classList.add("is-on"), MORPH_MS * 0.55);
        } else {
          titleEl.classList.remove("is-on");
        }

        function frame(now) {
          const raw = clamp((now - t0) / MORPH_MS, 0, 1);
          const t = easeInOutCubic(raw);
          const mixed = from.map((f, i) => morphStroke(f, to[i], t));
          paint(mixed);
          if (raw < 1) {
            raf = requestAnimationFrame(frame);
          } else {
            current = to;
            index = nextIndex;
            setLabel(index);
            resolve();
          }
        }
        raf = requestAnimationFrame(frame);
      });
    }

    async function loop() {
      while (running) {
        const hold = stages[index].showTitle ? TITLE_HOLD_MS : HOLD_MS;
        await new Promise((r) => { timer = setTimeout(r, hold); });
        if (!running) break;
        const next = (index + 1) % stages.length;
        await morphTo(next);
      }
    }

    function start() {
      running = false;
      clearTimeout(timer);
      cancelAnimationFrame(raf);
      running = true;
      index = 0;
      current = stages[0].strokes();
      paint(current);
      titleEl.classList.remove("is-on");
      setLabel(0);
      loop();
    }

    document.getElementById("replay").addEventListener("click", start);
    loop();
  </script>
</body>
</html>
